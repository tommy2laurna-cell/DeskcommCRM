name: tablero

# Tablero del dueño (GC5): números contra la base + journey a 390 px, con el código de ESTA rama.
# Supabase local + baseline.sql + build del app + Playwright (tests/e2e/tablero.spec.ts).
on:
  push:
    branches: [feat/reportes]
    paths:
      - ".github/workflows/tablero.yml"
      - "tests/e2e/tablero.spec.ts"
  pull_request:
    paths:
      - ".github/workflows/tablero.yml"
      - "app/api/v1/metrics/**"
      - "app/app/metrics/**"
      - "app/manifest.ts"
      - "app/icone/**"
      - "lib/reports/tablero*.ts"
      - "supabase/baseline.sql"
      - "tests/e2e/tablero.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tablero:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_PORT: "3001"
      APP_NAME: "Bodega Sur"
      APP_ACCENT_HEX: "#7A1F3D"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Subir Supabase local (sin la cadena de migrations)
        run: |
          mv supabase/migrations /tmp/migrations-off
          mkdir -p supabase/migrations
          supabase start

      - name: Extensiones + baseline.sql
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists vector with schema public;
          create extension if not exists citext with schema public;
          create extension if not exists pg_trgm with schema public;
          SQL
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/baseline.sql
          IDS=$(docker ps -q --filter name=supabase_realtime)
          [ -n "$IDS" ] && docker restart $IDS >/dev/null || true
          sleep 10

      - name: .env.e2e y build contra el Supabase local
        run: |
          pnpm e2e:env
          cp .env.e2e .env.local
          pnpm e2e:build

      - name: Semillas
        run: |
          pnpm exec tsx scripts/seed-e2e-credentials.ts

      - name: Instalar Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Tablero y journey móvil
        run: pnpm exec playwright test tests/e2e/tablero.spec.ts

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tablero
          path: |
            movil-out/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
