name: liquid-capturas

# Capturas ANTES (main) y DESPUÉS (esta rama) de las pantallas del Conectado,
# a 1440 y 390 px, oscuro y claro, más un test de contraste (axe) con la marca
# #F5D90A. Supabase local (CLI) + build de cada ref + Playwright.
# Sale un artefacto por corrida: `liquid-antes` y `liquid-despues`.
#
# Simulado: nada de IA ni de WhatsApp (estas pantallas no los necesitan).

on:
  push:
    branches: [feat/liquid]
    paths:
      - ".github/workflows/liquid-capturas.yml"
      - "tests/e2e/liquid-capturas.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: antes
            ref: main
            enforce: "0"
          - nombre: despues
            ref: ""
            enforce: "1"
    env:
      E2E_PORT: "3001"
      APP_ACCENT_HEX: "#F5D90A"
      LIQUID_AXE_ENFORCE: ${{ matrix.enforce }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ matrix.ref || github.sha }}
      - name: Traer el spec de capturas de la rama (el ANTES corre el spec nuevo contra el código viejo)
        run: |
          git checkout "${{ github.sha }}" -- tests/e2e/liquid-capturas.spec.ts
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Subir Supabase local (sin la cadena de migrations)
        run: |
          mv supabase/migrations /tmp/migrations-off
          mkdir -p supabase/migrations
          supabase start

      - name: Extensiones + baseline.sql
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists vector with schema public;
          create extension if not exists citext with schema public;
          create extension if not exists pg_trgm with schema public;
          SQL
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/baseline.sql
          IDS=$(docker ps -q --filter name=supabase_realtime)
          [ -n "$IDS" ] && docker restart $IDS >/dev/null || true
          sleep 10

      - name: .env.e2e y build contra el Supabase local
        run: |
          pnpm e2e:env
          cp .env.e2e .env.local
          pnpm e2e:build

      - name: Semillas
        run: |
          pnpm exec tsx scripts/seed-e2e-credentials.ts
          pnpm exec tsx scripts/seed-e2e-kanban.ts

      - name: Instalar Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Capturas + axe
        run: pnpm exec playwright test tests/e2e/liquid-capturas.spec.ts

      - name: Subir capturas y axe
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: liquid-${{ matrix.nombre }}
          path: |
            liquid-out/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Resumen
        if: always()
        run: |
          echo "### liquid-${{ matrix.nombre }}" >> "$GITHUB_STEP_SUMMARY"
          [ -f liquid-out/resumen.json ] && { echo '```json'; cat liquid-out/resumen.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || echo "sin resumen" >> "$GITHUB_STEP_SUMMARY"
